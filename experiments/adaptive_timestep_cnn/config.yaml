# Official CIFAR-10 code: |S|=3, f_S=40, queue capacity=5, entropy coefficient=0.01.
# Cosine schedule uses actor learning rate 1e-3 in the paper appendix.
adaptive:
  hidden_dim: 256
  hidden_depth: 2
  lr: 1.0e-3
  update_every: 40
  queue_size: 5
  n_select: 3
  ent_coef: 0.01
  probe_chunk: 8

# The stock Robomimic dataset otherwise writes a cache next to image.hdf5.
task:
  dataset:
    use_cache: false
  env_runner:
    n_envs: 8
